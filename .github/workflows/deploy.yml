name: Deploy

on:
  push:
    branches: [ras]

jobs:
  # Always runs, independent of Neon/Render secrets - this is the one that
  # must never be blocked by the other two.
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --include=dev

      - name: Build frontend static export
        env:
          NEXT_PUBLIC_API_URL: https://api.bulamu.site
          NEXT_PUBLIC_SITE_URL: https://bulamu.site
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-3BR26WNYPE
          NEXT_PUBLIC_COMPANY_URL: https://cruzeintelligentsystems.com
        run: npm run build --workspace=apps/frontend

      - name: Deploy to Hostinger
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
          REMOTE_DIR: ${{ secrets.HOSTINGER_REMOTE_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          tar -czf /tmp/site.tar.gz -C apps/frontend/out .
          scp -i ~/.ssh/hostinger_key -P "$PORT" -o StrictHostKeyChecking=accept-new /tmp/site.tar.gz "$SSH_USER@$HOST:~/site.tar.gz"
          ssh -i ~/.ssh/hostinger_key -p "$PORT" -o StrictHostKeyChecking=accept-new "$SSH_USER@$HOST" \
            "cd ${REMOTE_DIR:-public_html} && find . -mindepth 1 -delete && tar -xzf ~/site.tar.gz -C . && rm ~/site.tar.gz"

      # Render's free plan puts the API to sleep after 15 minutes without a
      # request, and the first request after that waits up to a minute while it
      # wakes - the main reason Bulamu "delays to load". A timer on the Hostinger
      # account pings /health every 10 minutes so it stays awake. /health does
      # not touch the database: Neon's free compute allowance would run out if
      # the database never slept, and it wakes in about a second on its own.
      # Idempotent (replaces its own line); never fails the deploy.
      - name: Keep the API awake (cron on Hostinger)
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/hostinger_key -p "$PORT" -o StrictHostKeyChecking=accept-new "$SSH_USER@$HOST"             '( crontab -l 2>/dev/null | grep -v "bulamu-keep-warm"; echo "*/10 * * * * curl -s -m 90 -o /dev/null https://api.bulamu.site/health # bulamu-keep-warm" ) | crontab - && echo "keep-warm timer installed" || echo "crontab not available on this plan - add the ping in hPanel > Advanced > Cron Jobs instead"'

  migrate-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --include=dev
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma

  # Render also auto-deploys natively on push if its own GitHub integration
  # is enabled (Settings -> Auto-Deploy on the service) - this step is a
  # belt-and-suspenders trigger for when it isn't, or RENDER_API_KEY isn't
  # set yet. Never blocks the other two jobs either way.
  deploy-render:
    runs-on: ubuntu-latest
    needs: migrate-database
    continue-on-error: true
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY not set - skipping explicit trigger (Render's own auto-deploy may still fire)."
            exit 0
          fi
          SERVICE_ID=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?name=bulamu-backend&limit=1" \
            | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d)[0].service.id))")
          curl -sf -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -d '{"clearCache":"do_not_clear"}'

  # How fast Bulamu answers, measured from GitHub's network after each deploy
  # (timings only - nothing private is printed in these public logs).
  speed-check:
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-render]
    steps:
      # Render deploys from git on its own; this waits until it is really
      # serving the commit just pushed, and fails loudly if it never does.
      - name: Confirm Render is running this commit
        run: |
          want="${GITHUB_SHA::7}"
          got=""
          for i in $(seq 1 40); do
            got=$(curl -s -m 90 https://api.bulamu.site/health | jq -r '.release // empty' 2>/dev/null || true)
            if [ "$got" = "$want" ]; then echo "Render is running $want"; break; fi
            echo "Render is running ${got:-an older version}; waiting for $want ($i/40)"
            sleep 30
          done
          if [ "$got" != "$want" ]; then
            echo "::error::Render did not start serving $want within 20 minutes. Check the Render dashboard: the auto-deploy branch (ras) and the build log."
            exit 1
          fi

      # The path a real visitor takes, end to end (yes/no answers and timings only).
      - name: Check the connection
        run: |
          api=https://api.bulamu.site
          conn=$(curl -s -m 90 "$api/health/connection")
          echo "API -> database: $(echo "$conn" | jq -c '{status, database, databaseMs, clientIpSource}')"
          [ "$(echo "$conn" | jq -r .database)" = "ok" ] || { echo "::error::The API cannot reach its database."; exit 1; }
          [ "$(echo "$conn" | jq -r .clientIpSource)" = "cf-connecting-ip" ] || echo "::warning::The API cannot see visitors' own addresses, so sign-in limits are shared between visitors."
          allow() { curl -s -o /dev/null -D - -X OPTIONS -H "Origin: $1" -H "Access-Control-Request-Method: POST" "$api/auth/login" | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}'; }
          for origin in https://bulamu.site https://www.bulamu.site; do
            [ "$(allow $origin)" = "$origin" ] || { echo "::error::The API refuses calls from $origin."; exit 1; }
          done
          [ -z "$(allow https://evil.example)" ] || { echo "::error::The API accepts calls from other websites."; exit 1; }
          echo "Cross-site access: bulamu.site and www.bulamu.site allowed, other sites refused"
          www=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" -m 60 https://www.bulamu.site/)
          echo "www.bulamu.site: $www"
          case "$www" in "301 https://bulamu.site/"*) ;; *) echo "::warning::www.bulamu.site does not redirect to bulamu.site.";; esac

      - name: Measure the API and the site
        run: |
          probe() { curl -s -o /dev/null -w "%{http_code}  connect %{time_connect}s  first byte %{time_starttransfer}s  total %{time_total}s" -m 120 "$1"; }
          echo "API /health (may include waking up):  $(probe https://api.bulamu.site/health)"
          for i in 1 2 3; do echo "API /health (awake), try $i:           $(probe https://api.bulamu.site/health)"; done
          echo "Site home page:                        $(probe https://bulamu.site/)"
          echo "Site sign-in page:                     $(probe https://bulamu.site/auth/login/)"
