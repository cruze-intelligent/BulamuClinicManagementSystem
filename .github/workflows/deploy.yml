name: Deploy

on:
  push:
    branches: [ras]

jobs:
  # Always runs, independent of Neon/Render secrets - this is the one that
  # must never be blocked by the other two.
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --include=dev

      - name: Build frontend static export
        env:
          NEXT_PUBLIC_API_URL: https://bulamu-backend.onrender.com
          NEXT_PUBLIC_SITE_URL: https://bulamu.site
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-3BR26WNYPE
          NEXT_PUBLIC_COMPANY_URL: https://cruzeintelligentsystems.com
        run: npm run build --workspace=apps/frontend

      - name: Deploy to Hostinger
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
          REMOTE_DIR: ${{ secrets.HOSTINGER_REMOTE_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          tar -czf /tmp/site.tar.gz -C apps/frontend/out .
          scp -i ~/.ssh/hostinger_key -P "$PORT" -o StrictHostKeyChecking=accept-new /tmp/site.tar.gz "$SSH_USER@$HOST:~/site.tar.gz"
          ssh -i ~/.ssh/hostinger_key -p "$PORT" -o StrictHostKeyChecking=accept-new "$SSH_USER@$HOST" \
            "cd ${REMOTE_DIR:-public_html} && find . -mindepth 1 -delete && tar -xzf ~/site.tar.gz -C . && rm ~/site.tar.gz"

      # Render's free plan puts the API to sleep after 15 minutes without a
      # request, and the first request after that waits up to a minute while it
      # wakes - the main reason Bulamu "delays to load". A timer on the Hostinger
      # account pings /health every 10 minutes so it stays awake. /health does
      # not touch the database: Neon's free compute allowance would run out if
      # the database never slept, and it wakes in about a second on its own.
      # Idempotent (replaces its own line); never fails the deploy.
      - name: Keep the API awake (cron on Hostinger)
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/hostinger_key -p "$PORT" -o StrictHostKeyChecking=accept-new "$SSH_USER@$HOST"             '( crontab -l 2>/dev/null | grep -v "bulamu-keep-warm"; echo "*/10 * * * * curl -s -m 90 -o /dev/null https://bulamu-backend.onrender.com/health # bulamu-keep-warm" ) | crontab - && echo "keep-warm timer installed" || echo "crontab not available on this plan - add the ping in hPanel > Advanced > Cron Jobs instead"'

  migrate-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --include=dev
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma

  # Render also auto-deploys natively on push if its own GitHub integration
  # is enabled (Settings -> Auto-Deploy on the service) - this step is a
  # belt-and-suspenders trigger for when it isn't, or RENDER_API_KEY isn't
  # set yet. Never blocks the other two jobs either way.
  deploy-render:
    runs-on: ubuntu-latest
    needs: migrate-database
    continue-on-error: true
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY not set - skipping explicit trigger (Render's own auto-deploy may still fire)."
            exit 0
          fi
          SERVICE_ID=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?name=bulamu-backend&limit=1" \
            | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d)[0].service.id))")
          curl -sf -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -d '{"clearCache":"do_not_clear"}'

  # How fast Bulamu answers, measured from GitHub's network after each deploy
  # (timings only - nothing private is printed in these public logs).
  speed-check:
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-render]
    steps:
      - name: Measure the API and the site
        run: |
          sleep 120
          probe() { curl -s -o /dev/null -w "%{http_code}  connect %{time_connect}s  first byte %{time_starttransfer}s  total %{time_total}s" -m 120 "$1"; }
          echo "API /health (may include waking up):  $(probe https://bulamu-backend.onrender.com/health)"
          for i in 1 2 3; do echo "API /health (awake), try $i:           $(probe https://bulamu-backend.onrender.com/health)"; done
          echo "Site home page:                        $(probe https://bulamu.site/)"
          echo "Site sign-in page:                     $(probe https://bulamu.site/auth/login/)"
