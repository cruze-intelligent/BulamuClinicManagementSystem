version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bulamu-postgres
    restart: always
    environment:
      POSTGRES_DB: bulamu
      POSTGRES_USER: bulamu_user
      POSTGRES_PASSWORD: bulamu_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bulamu-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://bulamu_user:bulamu_password@postgres:5432/bulamu?schema=public"
      JWT_SECRET: "bulamu_production_secret_key_2026"
      FRONTEND_URL: "http://localhost:3000"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bulamu-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    depends_on:
      - backend

volumes:
  postgres_data:

