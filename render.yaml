services:
  - type: web
    name: bulamu-backend
    runtime: node
    plan: free
    rootDir: .
    # --include=dev is required: Render skips devDependencies during `npm ci`
    # once NODE_ENV=production is set (a common PaaS convention), but the
    # build step needs typescript/@types/node/prisma/etc. which all live
    # there - without this flag the build fails with "Cannot find name
    # 'process'"-style errors even though it works fine locally.
    buildCommand: npm ci --include=dev && npx prisma generate --schema=apps/backend/prisma/schema.prisma && npm run build --workspace=apps/backend
    startCommand: npm start --workspace=apps/backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Point this at a non-expiring free Postgres (Neon or Supabase) rather
      # than a Render-managed free Postgres, which auto-expires after ~30 days.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_ENV
        value: sandbox
      - key: PESAPAL_IPN_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
